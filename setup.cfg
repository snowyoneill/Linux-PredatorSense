[flake8]
# House style: the codebase uses "##----Section----##" banner comments and
# occasionally leaves trailing whitespace / tight blank-line spacing around
# them. Those checks (and the related inline-comment ones) are style-only and
# were reported ~200x across the tree, so they are silenced here to keep flake8
# output focused on real issues. CI's blocking pass (E9,F63,F7,F82) is
# unaffected: --select takes precedence over ignore.
# extend-ignore (not ignore) so flake8's own defaults (E226, W503, ...) stay
# hidden; a plain ignore= would replace the default list and re-report them.
extend-ignore = E261, E262, E265, E266, E301, E302, E305, E222, W291, W293
max-line-length = 127
# flake8 does not honour .gitignore; without this a local "flake8 ." scans the
# venv (PyQt5 ships Python-2 shims full of F821s). CI has no venv, so this only
# makes local runs match CI.
exclude = venv, build, dist, .git
