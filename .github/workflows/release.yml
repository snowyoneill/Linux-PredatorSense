name: Release

# Builds the PyInstaller binary and attaches it to a GitHub release.
# Trigger by tagging a commit:  git tag v1.0 && git push origin v1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pyqt5-dev-tools qtbase5-dev python3-pyqt5 python3-pyqt5.qtchart

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run smoke test
      env:
        QT_QPA_PLATFORM: offscreen
      run: python tests/smoke_test.py

    - name: Build binary
      run: |
        pip install pyinstaller
        pyinstaller main.spec
        # Name the binary with the tag so the download is self-describing.
        mv dist/main dist/linux-predatorsense-${GITHUB_REF_NAME}

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        overwrite_files: true
        name: Linux PredatorSense ${{ github.ref_name }}
        body: |
          Prebuilt binary (Ubuntu 24.04 / x86-64, built on GitHub runners).

          ```
          chmod +x linux-predatorsense-${{ github.ref_name }}
          sudo -E ./linux-predatorsense-${{ github.ref_name }}
          ```

          Requires EC access (ec_sys write_support=1 or the acpi_ec DKMS
          module) - see README. Binaries are built on Ubuntu 24.04; other
          distros should run from source.
        files: dist/linux-predatorsense-${{ github.ref_name }}
